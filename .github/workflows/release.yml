name: Release

# Build a flashable firmware image on every version tag and publish it as a
# GitHub Release. The browser flasher itself lives on Pages (see pages.yml)
# and points at this release's "latest" assets — so the site never needs a
# redeploy when a new firmware ships.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5
    env:
      IDF_CCACHE_ENABLE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      # Full history + tags: the firmware version is `git describe --tags`
      # evaluated at CMake configure time (see top-level CMakeLists.txt).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The job runs as root inside the IDF container while the workspace
      # belongs to the runner user, so git refuses it as "dubious ownership",
      # `git describe` fails, and CMakeLists silently falls back to
      # project(VERSION 0.1.0). That is how v1.2.0 shipped announcing 0.1.0.
      - name: Trust the workspace inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache ccache objects
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v5.5-${{ github.sha }}
          restore-keys: |
            ccache-v5.5-

      - name: idf.py build (esp32p4)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32p4
          idf.py build

      - name: Collect firmware images
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          mkdir -p dist
          # Single image flashable at offset 0x0 — what the browser flasher uses.
          # Absolute -o: idf.py runs esptool from build/, so a relative path
          # would land in build/dist/ instead of the repo-root dist/.
          idf.py merge-bin -f raw -o "$PWD/dist/pixfrog-merged.bin"
          # Individual parts for CLI / advanced flashing.
          cp build/bootloader/bootloader.bin           dist/
          cp build/partition_table/partition-table.bin dist/
          cp build/pixfrog.bin                         dist/

      # A version mismatch is invisible once published — the image boots and
      # runs, it just lies about what it is, in the UI, the console and OTA.
      # Fail the build instead of shipping it.
      - name: Verify the embedded version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          embedded=$(python3 -c "
          import struct, sys
          d = open('dist/pixfrog.bin', 'rb').read()
          if struct.unpack('<I', d[32:36])[0] != 0xABCD5432:
              sys.exit('not an esp_app_desc_t')
          print(d[48:80].split(b'\0')[0].decode())
          ")
          echo "embedded=$embedded tag=$GITHUB_REF_NAME"
          if [ "$embedded" != "$GITHUB_REF_NAME" ]; then
            echo "::error::firmware reports '$embedded' but the tag is '$GITHUB_REF_NAME'"
            exit 1
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist
      - name: Create or update release with firmware assets
        env:
          GH_TOKEN: ${{ github.token }}
        # Idempotent: if the release was pre-created from the GitHub UI (or by
        # a previous workflow run), just upload/overwrite the firmware assets
        # on it. Otherwise create it from scratch.
        run: |
          assets=(
            dist/pixfrog-merged.bin
            dist/bootloader.bin
            dist/partition-table.bin
            dist/pixfrog.bin
          )
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — uploading assets."
            gh release upload "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              "${assets[@]}"
          else
            echo "Creating release $GITHUB_REF_NAME."
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "pixfrog $GITHUB_REF_NAME" \
              --generate-notes \
              "${assets[@]}"
          fi
