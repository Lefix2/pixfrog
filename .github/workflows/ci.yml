name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Decide whether the code-building jobs need to run at all. A branch that
  # only touches documentation (Markdown anywhere, docs/, the GitHub Pages
  # site, LICENSE/.gitignore) produces code='false', so the heavy IDF/host
  # builds are skipped. The filter is a "everything minus docs" allowlist so
  # it fails safe: an unrecognised path still triggers a full build.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**/*'
              - '!**/*.md'
              - '!*.md'
              - '!docs/**'
              - '!.github/pages/**'
              - '!LICENSE'
              - '!.gitignore'

  format-check:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-format 18
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: clang-format --dry-run -Werror on every C/C++ source
        run: |
          files=$(git ls-files '*.cpp' '*.h')
          echo "Checking $(echo "$files" | wc -l) files..."
          echo "$files" | xargs clang-format --dry-run -Werror --style=file

  host-tests:
    name: Host unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Every suite in one CMake project (tests/CMakeLists.txt), driven by ctest.
      - name: Build + run every host suite
        run: |
          cmake -S tests -B build/tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build/tests --parallel
          ctest --test-dir build/tests --output-on-failure

  sanitizers:
    name: Host tests (ASan + UBSan)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build + run every host suite under ASan + UBSan
        run: |
          cmake -S tests -B build/tests-san -DPIXFROG_SANITIZE=ON
          cmake --build build/tests-san --parallel
          ctest --test-dir build/tests-san --output-on-failure

  coverage:
    name: Coverage (host suites + emulator)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SDL2 + gcovr
        run: |
          sudo apt-get update && sudo apt-get install -y libsdl2-dev
          python -m pip install gcovr
      - name: Build, run, report
        run: python tools/coverage.py
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage/html/
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: build/coverage/coverage.lcov
          # Only our report: the action's own gcov search would re-add system
          # headers and the test sources.
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  emulator:
    name: UI emulator (SDL2 host build + smoke test)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Build emulator (NV3007 428x142 layout, default)
        run: |
          cd tools/emulator
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Build emulator (ST7789 320x240 layout)
        run: |
          cd tools/emulator
          cmake -B build.st7789 -DCMAKE_BUILD_TYPE=Release -DPIXFROG_EMU_PANEL=st7789
          cmake --build build.st7789 --parallel

      - name: Headless menu-FSM smoke test (both layouts)
        run: |
          ./tools/emulator/smoke.sh
          ./tools/emulator/smoke.sh build.st7789/pixfrog_emu

  idf-build:
    name: ESP-IDF build for esp32p4 (${{ matrix.variant }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ESP32-P4 needs IDF v5.5+: the LCD_CAM RGB panel driver used by
        # led_output is gated behind SOC_LCD_RGB_SUPPORTED, which is only
        # enabled for the P4 from v5.4 (IDF-7465), and the v5.4 esp_eth
        # ETH_ESP32_EMAC_DEFAULT_CONFIG() macro uses out-of-order designated
        # initializers that g++ rejects (fixed in v5.5).
        idf_version: ['v5.5']
        # Build every config variant so each compile path stays green:
        # nv3007 = the default sdkconfig, no overlay (PARLIO LED backend + the
        # NV3007 bar panel the rack ships with); st7789 = overlay selecting the
        # 320x240 panel inside the same TFT backend; oled = overlay selecting
        # the SSD1306. The legacy LCD_CAM LED backend (overlay
        # sdkconfig.ci.lcdcam) is no longer CI-built — kept for manual
        # debugging only.
        variant: ['oled', 'nv3007', 'st7789']
    container:
      # Image ships IDF preinstalled at $IDF_PATH; we source export.sh below.
      image: espressif/idf:${{ matrix.idf_version }}
    env:
      # idf.py wraps the compilers with ccache; persisting CCACHE_DIR across runs
      # turns a full IDF recompile into ~99% cache hits (cuts most of the build).
      IDF_CCACHE_ENABLE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      # Full history + tags: the firmware version is `git describe --tags`
      # evaluated at CMake configure time (see top-level CMakeLists.txt).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Root in the container vs runner-owned workspace: without this git
      # refuses the repo and `git describe` yields nothing, so the build silently
      # carries the fallback version. Same fix as release.yml.
      - name: Trust the workspace inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache ccache objects
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.ccache
          # New key every commit so the cache is always re-saved; restore-keys
          # falls back to the most recent prior cache to stay warm.
          key: ccache-${{ matrix.idf_version }}-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.idf_version }}-${{ matrix.variant }}-

      - name: idf.py set-target esp32p4 && idf.py build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py --version
          if [ "${{ matrix.variant }}" != "nv3007" ]; then
            export SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ci.${{ matrix.variant }}"
          fi
          idf.py set-target esp32p4
          idf.py build

      - name: Show binary size & ccache stats
        if: always()
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py size || true
          ccache -s || true

  # Single aggregating gate: make THIS the only required status check on main.
  # It runs on every PR (always()), so the required check is never stuck
  # pending — unlike trigger-level paths-ignore. It passes when every upstream
  # job either succeeded or was skipped (doc-only branch), and fails if any
  # real job failed or was cancelled.
  ci-gate:
    name: CI gate
    if: always()
    needs: [changes, format-check, host-tests, sanitizers, coverage, emulator, idf-build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        shell: bash
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required CI job failed or was cancelled."
              exit 1
            fi
          done
          echo "All required jobs passed (or were skipped on a doc-only branch)."
